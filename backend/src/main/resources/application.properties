# ===================================================================
# NoteLagbe Backend - Production & Development Configuration
# All sensitive credentials are provided via Environment Variables.
# Default values allow seamless zero-config local development.
# ===================================================================

# Server Port (Render passes PORT environment variable automatically)
server.port=${PORT:8888}

# Application Identification
spring.application.name=notelagbe-backend

# File Upload Limits (Up to 100MB for large handwritten lecture notes, exam papers & slides)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Datasource Configuration
# Local default: In-memory H2 database (zero configuration needed)
# Production (Render + TiDB Cloud / MySQL):
#   SPRING_DATASOURCE_URL=jdbc:mysql://<host>:4000/<database>?sslMode=VERIFY_IDENTITY&useSSL=true&serverTimezone=UTC
#   SPRING_DATASOURCE_USERNAME=<username>
#   SPRING_DATASOURCE_PASSWORD=<password>
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:notelagbedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# HikariCP Connection Pool Resilience (prevents stale socket hangs on cloud MySQL/TiDB)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.connection-init-sql=SELECT 1

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Bound HTTP socket read wait cleanly
server.tomcat.connection-timeout=15000

# H2 Console (Disabled in production by default unless H2 is used)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Cloudinary Integration (Permanent cloud storage for Render deployments)
# Supply these in Render dashboard to store files on Cloudinary:
#   CLOUDINARY_CLOUD_NAME=<your_cloud_name>
#   CLOUDINARY_API_KEY=<your_api_key>
#   CLOUDINARY_API_SECRET=<your_api_secret>
# If not provided, backend automatically falls back to local uploads/ directory.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Cloudflare R2 Object Storage (Zero-egress, unlimited file size storage for large notes & PDFs)
# Supply these in Render dashboard:
#   R2_ACCOUNT_ID=<your_cloudflare_account_id>
#   R2_ACCESS_KEY_ID=<your_r2_access_key_id>
#   R2_SECRET_ACCESS_KEY=<your_r2_secret_access_key>
#   R2_BUCKET_NAME=<your_bucket_name_e_g_notelagbe-materials>
#   R2_PUBLIC_URL=<optional_public_domain_e_g_https://pub-xxx.r2.dev>
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:notelagbe-materials}
r2.public-url=${R2_PUBLIC_URL:}

# Security & JWT Token Management
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Rate Limiter (Requests per minute per IP)
app.rate-limit.capacity=120
app.rate-limit.tokens-per-minute=120

# Demo Mode: FALSE by default. Zero dummy accounts, zero fake reviews/notes.
app.demo.enabled=${APP_DEMO_ENABLED:false}

# Academic Catalog Initializer: Pre-loads official SEU courses and faculty if DB is empty
app.catalog.init-enabled=${APP_CATALOG_INIT:true}

# Optional Initial Super Admin Email (The first user registered also automatically becomes SUPER_ADMIN)
app.admin.initial-email=${INITIAL_ADMIN_EMAIL:admin@seu.edu.bd}
app.admin.initial-password=${INITIAL_ADMIN_PASSWORD:Admin@Password123!}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.admin.owner-email=${APP_OWNER_EMAIL:}

# Email / SMTP & HTTPS API Configuration
# Note: Render Free tier blocks outbound SMTP ports (25/465/587). Direct SMTP automatically falls back
# over HTTPS Port 443 to NoteLagbe's built-in Vercel Gmail Relay (/api/mail-relay) with no extra setup.
# Credentials can also be configured dynamically by Super Admin in Admin Console -> System Settings.
email.provider=${EMAIL_PROVIDER:}
email.from=${EMAIL_FROM:}
email.from-name=${EMAIL_FROM_NAME:NoteLagbe \u2022 Southeast University}
email.brevo.api-key=${BREVO_API_KEY:}
email.resend.api-key=${RESEND_API_KEY:}
email.apps-script.url=${EMAIL_WEBHOOK_URL:}
email.apps-script.secret=${EMAIL_WEBHOOK_SECRET:}
email.vercel-relay.auto-fallback=${EMAIL_VERCEL_RELAY_AUTO_FALLBACK:true}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging Configuration
logging.level.com.notelagbe=INFO
logging.level.org.springframework.security=WARN
